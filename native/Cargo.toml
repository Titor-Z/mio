# native —— mio 原生后端（AOT → Cranelift → 本机机器码）。
#
# 独立 workspace，与根 crate（阶段 A / Boa）零耦合：根 `Cargo.toml` 与 `src/` 不因本目录受任何影响。
# 形态对齐 `compiler/`（同为嵌套 workspace + 独立 Cargo.lock）。
#
# 范围（阶段 B MVP，见 docs/语法讨论书.md 与 TL20261110T041429）：
#   做：i32/i64/f64/number/boolean/void；function；let/const（强制类型标注）；
#      if/while/for/break/continue/return；一元/二元/比较/逻辑/?:；函数调用；print。
#   不做：模块、string、数组、struct/enum/class、GC、闭包、泛型、异常、unsafeCast、sourcemap。
#
# 临时偏离：不建独立 IR，只做 TIR（带类型标注的 AST）。触发条件：出现第二个后端（wasm）即补展平。

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# cranelift 在 debug profile 下性能骤降（约十倍），单独为其开启优化，否则迭代慢到无法工作。
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-module]
opt-level = 3
[profile.dev.package.cranelift-object]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
