[package]
name = "mio"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
description = "TypeScript 一等公民的运行时：TS 源码直接作为输入，运行时内部完成类型擦除与执行"
license = "MIT"
repository = "https://github.com/titor-z/mio"
readme = "README.md"
keywords = ["typescript", "runtime", "javascript", "interpreter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mio"
path = "src/main.rs"

[lib]
name = "mio"
path = "src/lib.rs"

[dependencies]
# JavaScript 执行引擎（阶段 A 使用，隔离在 engine 模块内）
boa_engine = "0.22"
boa_gc = "0.22"
boa_parser = "0.22"

# TypeScript 转译管线（阶段 A 使用，隔离在 transpiler 模块内）
oxc_allocator = "0.156"
oxc_ast = "0.156"
oxc_codegen = "0.156"
oxc_parser = "0.156"
oxc_semantic = "0.156"
oxc_span = "0.156"
oxc_transformer = "0.156"

# TypeScript 类型检查与编译器前端（fork 自 oxc-project/tsrs，源码见 `compiler/`）。
# 跨 workspace 的 path 依赖：`mio check` 直接复用 tsrs 自己的命令行驱动 `tsrs_execute::command_line`
# （Program 关键字段为 pub(crate)，外部无法自行构造；走官方驱动最稳），自带诊断输出与退出码。
tsrs_execute = { path = "compiler/crates/tsrs_execute" }

# 通用工具
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP 客户端（fetch 的阻塞式实现；阶段 A 不引入异步运行时，线程包装后由宿主事件循环收取结果）
ureq = "2"

# WHATWG URL 解析（url crate 的 Parser 即规范状态机实现）与 application/x-www-form-urlencoded
# 编解码（URLSearchParams 的序列化族）
url = "2"
form_urlencoded = "1"

[profile.release]
# fat LTO 在本项目依赖规模下编译时间超过十分钟，采用 thin LTO 折中
lto = "thin"
codegen-units = 1
strip = true
